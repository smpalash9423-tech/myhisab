<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2260">
<title>আমার হিসাব</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070d1f; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #msg { display: none; color: #fff; font-family: sans-serif; padding: 24px; line-height: 1.6; }
</style>
</head>
<body>

<div id="msg">APP_URL-এ আপনার Apps Script এর /exec লিংক বসান।</div>
<iframe id="app" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>

<script>
  // ↓↓↓ এখানে আপনার Apps Script Web App-এর /exec লিংক বসান ↓↓↓
  var APP_URL = "https://script.google.com/macros/s/AKfycbwK2hloAkuJOn3r0LF-vivAz1ZgxONpEY7ZpHrsSxI-CJQZ-EiMOm8tt9PQZhqziYIO4g/exec";
  // ↑↑↑ ----------------------------------------------- ↑↑↑

  if (APP_URL.indexOf("https://script.google.com/") === 0) {
    document.getElementById("app").src = APP_URL;
  } else {
    document.getElementById("app").style.display = "none";
    document.getElementById("msg").style.display = "block";
  }
</script>

</body>
</html>
